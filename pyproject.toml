[project]
name = "mindmap"
version = "0.1.0"
description = "DeepWiki + Relate: Universal Project Intelligence MCP"
requires-python = ">=3.10"
dependencies = [
    "fastapi >=0.135.0",
    "uvicorn >=0.42.0",
    "pydantic >=2.14.0",
    "google-generativeai >=0.3.0",
    "tiktoken >=0.5.0",
    "adalflow >=1.1.0",
    "numpy >=1.24.0",
    "faiss-cpu >=1.7.4",
    "langid >=1.1.6",
    "requests >=2.34.2",
    "jinja2 >=3.1.2",
    "python-dotenv >=1.0.0",
    "openai >=1.76.2",
    "ollama >=0.4.8",
    "aiohttp >=3.14.5",
    "boto3 >=1.34.0",
    "websockets >=11.0.3",
    "azure-identity >=1.12.0",
    "azure-core >=1.24.0",
    "anthropic >=0.117.1",
    "gitpython >=3.1.0",
    "urllib3 >=2.8.0",
    "multidict >=6.9.1,<7",
    "pyjwt >=2.15.1",
    "relate-db >=1.2.0",
    "tree-sitter >=0.25.0",
    "tree-sitter-python >=0.25.0",
    "tree-sitter-javascript >=0.25.0",
    "tree-sitter-typescript >=0.23.2",
    "tree-sitter-go >=0.25.0",
    "tree-sitter-rust >=0.24.2",
    "tree-sitter-java >=0.23.5",
    "tree-sitter-cpp >=0.23.4",
    "mcp >=1.26.0",
    "pyyaml >=6.0",
    "networkx >=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest >=9.0.0",
    "pytest-asyncio >=0.23.0",
    "ruff >=0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mind*", "map*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"